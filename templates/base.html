<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PawMatch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="pengumuman">Adopsi, bukan beli. Temukan teman berkaki empat yang cocok untukmu.</div>
  <header class="topbar">
    <nav class="wrap nav">
      <a href="{{ url_for('beranda') }}" class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="9" r="2"/><circle cx="9.5" cy="5" r="2"/><circle cx="14.5" cy="5" r="2"/><circle cx="19" cy="9" r="2"/><path d="M8 16c0-2.5 1.8-5 4-5s4 2.5 4 5c0 2-1.5 3-4 3s-4-1-4-3z"/></svg>
        PawMatch
      </a>
      <div class="nav-links">
        <a href="{{ url_for('beranda') }}#katalog">Katalog</a>
        <a href="{{ url_for('cocok') }}">Cek kecocokan</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Proyek akhir Aplikasi Web. Data: PetFinder.my (versi ringkas TensorFlow).
  </footer>
</body>
</html>
